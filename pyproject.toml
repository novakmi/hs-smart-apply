[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hs-smart-apply"
version = "0.1.0"
description = "A smart preprocessor for herdr-spreader YAML layouts."
readme = "README.md"
authors = [
  {name = "Michal Novak", email = "it.novakmi@gmail.com"}
]
maintainers = [
  {name = "Michal Novak", email = "it.novakmi@gmail.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0"]
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
]
lint = [
    "ruff",
]
test = [
    "coverage",
    "pytest",
]
typecheck = [
    "ty",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.urls]
bugs = "https://github.com/novakmi/hs-smart-apply/issues"
changelog = "https://github.com/novakmi/hs-smart-apply/releases"
documentation = "https://novakmi.github.io/hs-smart-apply/"
homepage = "https://github.com/novakmi/hs-smart-apply"

[project.scripts]
hs-smart-apply = "hs_smart_apply.cli:main"
hs_smart_apply = "hs_smart_apply.cli:main"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/hs_smart_apply"]

[tool.uv]
package = true
default-groups = ["dev"]
