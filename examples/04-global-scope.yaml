# Shared declarations are exported in every pane command.
env:
  APP_ROOT: "${HOME}/code/my-app"
  API_DIR: "${APP_ROOT}/services/api"
  NODE_ENV: ${NODE_ENV:-development}
workspaces:
  - name: api
    root: "${API_DIR}"
    commands:
      - echo "Launching API in $NODE_ENV mode"
    tabs:
      - label: server
        panes:
          - commands:
              - npm run start
