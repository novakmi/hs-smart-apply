# Values are declared in the layout; the process environment is not consulted.
workspaces:
  - name: web-app
    env:
      PROJECT_ROOT: "~/code/my-company/web-app"
      NODE_ENV: ${NODE_ENV:-development}
    root: "$PROJECT_ROOT"
    locals:
      START_COMMAND: npm run dev
    tabs:
      - label: server
        panes:
          - commands:
              - echo "Starting in $NODE_ENV mode"
              - $START_COMMAND
