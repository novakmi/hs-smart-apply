# Env values can expand references from the process environment and other env entries.
workspaces:
  - name: web-app
    env:
      PROJECT_ROOT: "${HOME}/code/my-company/web-app"
      NODE_ENV: ${NODE_ENV:-development}
    root: "$PROJECT_ROOT"
    locals:
      START_COMMAND: npm run dev
    tabs:
      - label: server
        panes:
          - commands:
              - echo "Starting in $NODE_ENV mode"
              - $START_COMMAND
